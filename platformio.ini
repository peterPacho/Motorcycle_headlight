[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = 
	teemuatlut/TMCStepper@^0.7.3
	budryerson/TFLI2C@^0.2.0
	waspinator/AccelStepper@^1.64
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
